<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">

        <h2>Log in</h2>

        <form action="">
            <div class="login">
                <input type="name" required>
                <label for="">Name</label>
            </div>

            <div class="login">
                <input type="age" required>
                <label for="">Age</label>
            </div>

            <div class="login">
                <input type="gender" required>
                <label for="">Gender</label>
            </div>

            <div class="login">
                <input type="phone" required>
                <label for="">Phone No.</label>
            </div>

            <div class="login">
                <input type="e-mail" required>
                <label for="">E-mail</label>
            </div>

             <a href=""><input id="btn" type="button" value="Login"></a>
            
        </form>
    </div>
</body>
</html>
